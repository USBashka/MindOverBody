      <path d="M 157,368 V 272 H 183 L 205,316 L 227,272 H 253 V 368 H 228 V 317 L 213,347 H 197 L 182,317 V 368 Z"/>
      <path fill-rule="evenodd" d="M 316,270 C 347,270 366,289 366,320 C 366,351 347,370 316,370 C 285,370 266,351 266,320 C 266,289 285,270 316,270 Z M 316,294 C 301,294 293,304 293,320 C 293,336 301,346 316,346 C 331,346 339,336 339,320 C 339,304 331,294 316,294 Z"/>
      <path fill-rule="evenodd" d="M 380,272 H 432 C 458,272 473,281 473,297 C 473,308 467,315 458,319 C 470,322 477,330 477,342 C 477,360 462,368 435,368 H 380 Z M 406,293 V 309 H 430 C 441,309 446,307 446,301 C 446,295 441,293 430,293 Z M 406,329 V 347 H 433 C 445,347 450,345 450,338 C 450,332 445,329 433,329 Z"/>
      <path class="pulse" d="M 293,423 H 307 L 313,416 L 320,431 L 327,411 L 333,423 H 347" fill="none" stroke="#cc684b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="284" cy="423" r="1.5" opacity=".35"/>
      <circle cx="356" cy="423" r="1.5" opacity=".35"/>
    </g>
  </g>
</svg>
