[package]
name = "rusterize"
description = "Small native-canvas applications with shared Rust drawing and input"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/USBashka/Rusterize"

[features]
default = ["native"]
native = ["dep:windows", "dep:windows-numerics"]
webview = ["native", "dep:webview2-com"]
shaders = ["dep:glow", "dep:windows", "windows/Win32_Graphics_OpenGL"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glow = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common"
] }
windows-numerics = { version = "0.3.1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
